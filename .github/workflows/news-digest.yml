name: news-digest daily

on:
  schedule:
    - cron: "40 21 * * *"  # UTC 21:40 = 한국 06:40
  workflow_dispatch:

permissions:
  contents: write  # news/ 폴더를 main에 커밋하기 위해

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 실행이 시작된 커밋이 아니라 지금 브랜치 끝을 받는다. 앞선 실행이 news/를 커밋한 뒤에
          # 기다리던 실행이 시작되면 그 커밋 위에서 만들도록(같은 날짜 파일 충돌 방지)
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 요약 페이지 만들기
        working-directory: news-digest
        run: python -m newsdigest --out ../news
      - name: news/ 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git commit -m "news: $(TZ=Asia/Seoul date +%F) 아침 뉴스 요약"
          # 그 사이 다른 커밋이 끼어들어도, news/ 충돌은 이번에 만든 최신 결과로 정리한다
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
